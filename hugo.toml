locale = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
enableGitInfo = true
title = "Barcelona Big Blues Band"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true

# ══════════════════════════════════════════════════════════════
# IDIOMES — CA · ES · EN
# ══════════════════════════════════════════════════════════════

[languages.en]
  contentDir = "content/en"
  title = "Barcelona Big Blues Band"
  label = "English"
  locale = "en-GB"
  weight = 1

  [languages.en.params]
    description = "Official website of double bassist Ivan Kovačević: Balkan, jazz, rhythm & blues from Barcelona. Biography, projects, discography, gigs, videos and booking."

[languages.ca]
  contentDir = "content/ca"
  title = "Barcelona Big Blues Band"
  label = "Català"
  locale = "ca-ES"
  weight = 2

  [languages.ca.params]
    description = "Web oficial del contrabaixista Ivan Kovačević: balcànic, jazz, rhythm & blues des de Barcelona. Biografia, projectes, discografia, concerts, vídeos i contractació."

[languages.es]
  contentDir = "content/es"
  title = "Barcelona Big Blues Band"
  label = "Español"
  locale = "es-ES"
  weight = 3

  [languages.es.params]
    description = "Web oficial del contrabajista Ivan Kovačević: balcánico, jazz, rhythm & blues desde Barcelona. Biografía, proyectos, discografía, conciertos, vídeos y contratación."

[params]
description = "Official website of double bassist Ivan Kovačević."
tagline     = "Double Bass · Balkan · Jazz · Rhythm & Blues"
og_image    = "images/og-image.jpg"

promo_enabled = false
promo_text    = ""
promo_url     = ""
promo_cta     = ""

# Google Calendar (agenda) — pendent de crear pel compte de Joan/LinuxBCN
google_calendar_ical = ""

[[params.socials]]
  name = "Instagram"
  icon = "instagram"
  url  = "https://www.instagram.com/kovacevic_doublebass/"

[[params.socials]]
  name = "Facebook"
  icon = "facebook"
  url  = "https://www.facebook.com/ivan.kovacevic.5686"

[[params.socials]]
  name = "YouTube"
  icon = "youtube"
  url  = "https://www.youtube.com/channel/UCG-CSJzP_90xHVhaDQj6PvA"

# Patrocinadors / endorsaments (logo al peu, entre xarxes i text legal)
# Desactivat: la pàgina /daddario/ es manté (noindex) per si torna a ser espònsor,
# però sense enllaç al peu. Per reactivar, descomentar aquest bloc.
# [[params.sponsors]]
#   name     = "D'Addario"
#   page     = "daddario"
#   external = "https://www.daddario.com"
#   logo     = "images/sponsors/daddario.png"

[params.analytics]
goatcounter = "ivankovacevic"
enabled     = true
since       = "2026-10-15"   # inici del seguiment (producció)

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[mediaTypes]
  [mediaTypes."text/calendar"]
    suffixes = ["ics"]

[outputFormats]
  [outputFormats.Calendar]
    mediaType = "text/calendar"
    isPlainText = true

baseURL = "https://barcelonabigbluesband.com/"

