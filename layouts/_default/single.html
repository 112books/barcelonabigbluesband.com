{{ define "main" }}
<div class="page-wrap{{ if eq .Type "legal" }} page-wrap--legal{{ end }}"{{ if eq .Type "legal" }} style="--legal-bg: url('{{ "images/wp/legal-bg.jpg" | absURL }}')"{{ end }}>
  <div class="page-inner page-inner--narrow">
    <button type="button" class="back-link" data-back>← {{ i18n "back" | default "Tornar" }}</button>
    <h1 class="page-title">{{ .Title }}{{ with index hugo.Data.refs40 .Params.translationKey }}
      <a class="ref40" href="{{ . }}" target="_blank" rel="noopener"
         title="{{ i18n "ref40_title" | default "Fitxa a 40 anys de blues a Barcelona" }}">
        <picture>
          <source srcset="{{ "images/40anys/logo-96.webp" | relURL }}" type="image/webp">
          <img src="{{ "images/40anys/logo-96.png" | relURL }}" width="96" height="96" alt="" loading="lazy" decoding="async">
        </picture>
      </a>{{ end }}</h1>
    <div class="prose">{{ .Content }}</div>
  </div>
</div>
{{ end }}
