{{ define "main" }}
<div class="page-wrap">
  <div class="page-inner page-inner--narrow">
    <button type="button" class="back-link" data-back>← {{ i18n "back" | default "Tornar" }}</button>
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Params.photo }}
    <div class="prose">
      <img src="{{ strings.TrimPrefix "/" . | relURL }}" alt="{{ $.Params.name | default $.Title }}">
    </div>
    {{ end }}
    <div class="prose">{{ .Content }}</div>
    {{ $links := index (index hugo.Data "project-links") .Params.translationKey }}
    {{ with $links }}
    <div class="project-links">
      {{ range . }}
      <a class="project-links__item" href="{{ .url }}" target="_blank" rel="noopener" aria-label="{{ .platform }}">
        {{ partial "icons/platform-icon.html" .platform }}
      </a>
      {{ end }}
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
