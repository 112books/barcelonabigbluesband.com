backend:
  name: github
  repo: 112books/barcelonabigbluesband.com
  branch: staging
  base_url: https://cms-oauth-bratia-y855.vercel.app
  auth_endpoint: /api/auth

publish_mode: editorial_workflow

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

locale: "es"

collections:
  # ─── Configuració global ──────────────────────────
  - name: "settings"
    label: "Configuración"
    files:
      - name: "contact"
        label: "Contacto"
        file: "data/contact.yaml"
        fields:
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Teléfono", name: "phone", widget: "string", required: false }
          - { label: "Texto (CA)", name: "intro_ca", widget: "text", required: false }
          - { label: "Texto (ES)", name: "intro_es", widget: "text", required: false }
          - { label: "Texto (EN)", name: "intro_en", widget: "text", required: false }
      - name: "social"
        label: "Redes sociales"
        file: "data/social.yaml"
        fields:
          - { label: "Facebook", name: "facebook", widget: "string", required: false }
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "YouTube", name: "youtube", widget: "string", required: false }
          - { label: "Spotify", name: "spotify", widget: "string", required: false }
          - { label: "Bandcamp", name: "bandcamp", widget: "string", required: false }

  # ─── Pàgines per idioma ───────────────────────────
  - name: "pages-ca"
    label: "Pàgines (CA)"
    files:
      - { name: "home-ca", label: "Portada", file: "content/ca/_index.md",
          fields: [ { label: "Títol", name: "title", widget: "string" },
                    { label: "Cos", name: "body", widget: "markdown", required: false } ] }
      - { name: "biografia-ca", label: "Biografia", file: "content/ca/biografia/_index.md",
          fields: [ { label: "Títol", name: "title", widget: "string" },
                    { label: "Fondo", name: "bg", widget: "image", required: false },
                    { label: "Descripción", name: "description", widget: "string", required: false },
                    { label: "Cos", name: "body", widget: "markdown" } ] }
      - { name: "contacte-ca", label: "Contacte", file: "content/ca/contacte/_index.md",
          fields: [ { label: "Títol", name: "title", widget: "string" },
                    { label: "Cos", name: "body", widget: "markdown", required: false } ] }

  - name: "pages-es"
    label: "Páginas (ES)"
    files:
      - { name: "home-es", label: "Portada", file: "content/es/_index.md",
          fields: [ { label: "Título", name: "title", widget: "string" },
                    { label: "Cuerpo", name: "body", widget: "markdown", required: false } ] }
      - { name: "biografia-es", label: "Biografía", file: "content/es/biografia/_index.md",
          fields: [ { label: "Título", name: "title", widget: "string" },
                    { label: "Fondo", name: "bg", widget: "image", required: false },
                    { label: "Descripción", name: "description", widget: "string", required: false },
                    { label: "Cuerpo", name: "body", widget: "markdown" } ] }
      - { name: "contacto-es", label: "Contacto", file: "content/es/contacto/_index.md",
          fields: [ { label: "Título", name: "title", widget: "string" },
                    { label: "Cuerpo", name: "body", widget: "markdown", required: false } ] }

  - name: "pages-en"
    label: "Pages (EN)"
    files:
      - { name: "home-en", label: "Home", file: "content/en/_index.md",
          fields: [ { label: "Title", name: "title", widget: "string" },
                    { label: "Body", name: "body", widget: "markdown", required: false } ] }
      - { name: "biography-en", label: "Biography", file: "content/en/biography/_index.md",
          fields: [ { label: "Title", name: "title", widget: "string" },
                    { label: "Background", name: "bg", widget: "image", required: false },
                    { label: "Description", name: "description", widget: "string", required: false },
                    { label: "Body", name: "body", widget: "markdown" } ] }
      - { name: "contact-en", label: "Contact", file: "content/en/contact/_index.md",
          fields: [ { label: "Title", name: "title", widget: "string" },
                    { label: "Body", name: "body", widget: "markdown", required: false } ] }

  # ─── Discografia ─────────────────────────────────
  - name: "discography-ca"
    label: "Discografia (CA)"
    label_singular: "Disc"
    folder: "content/ca/discografia"
    create: true
    slug: "{{slug}}"
    filter: { field: "headless", pattern: "^$" }
    summary: "{{year}} — {{title}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Tipo", name: "type_release", widget: "select", options: ["album", "single", "ep"] }
      - { label: "Año", name: "year", widget: "number", value_type: "int", required: true }
      - { label: "Portada", name: "cover", widget: "image", required: false }
      - { label: "Spotify Embed", name: "spotify_embed", widget: "string", required: false }
      - { label: "Spotify URL", name: "spotify", widget: "string", required: false }
      - { label: "Apple Music", name: "apple_music", widget: "string", required: false }
      - { label: "YouTube", name: "youtube", widget: "string", required: false }
      - { label: "Bandcamp", name: "bandcamp", widget: "string", required: false }
      - { label: "Smartlink", name: "smartlink", widget: "string", required: false }
      - { label: "Orden", name: "weight", widget: "number", value_type: "int", required: false }
      - { label: "Descripción", name: "body", widget: "markdown", required: false }

  - name: "discography-es"
    label: "Discografía (ES)"
    label_singular: "Disco"
    folder: "content/es/discografia"
    create: true
    slug: "{{slug}}"
    filter: { field: "headless", pattern: "^$" }
    summary: "{{year}} — {{title}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Tipo", name: "type_release", widget: "select", options: ["album", "single", "ep"] }
      - { label: "Año", name: "year", widget: "number", value_type: "int", required: true }
      - { label: "Portada", name: "cover", widget: "image", required: false }
      - { label: "Spotify Embed", name: "spotify_embed", widget: "string", required: false }
      - { label: "Spotify URL", name: "spotify", widget: "string", required: false }
      - { label: "Apple Music", name: "apple_music", widget: "string", required: false }
      - { label: "YouTube", name: "youtube", widget: "string", required: false }
      - { label: "Bandcamp", name: "bandcamp", widget: "string", required: false }
      - { label: "Smartlink", name: "smartlink", widget: "string", required: false }
      - { label: "Orden", name: "weight", widget: "number", value_type: "int", required: false }
      - { label: "Descripción", name: "body", widget: "markdown", required: false }

  - name: "discography-en"
    label: "Discography (EN)"
    label_singular: "Release"
    folder: "content/en/discography"
    create: true
    slug: "{{slug}}"
    filter: { field: "headless", pattern: "^$" }
    summary: "{{year}} — {{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Type", name: "type_release", widget: "select", options: ["album", "single", "ep"] }
      - { label: "Year", name: "year", widget: "number", value_type: "int", required: true }
      - { label: "Cover", name: "cover", widget: "image", required: false }
      - { label: "Spotify Embed", name: "spotify_embed", widget: "string", required: false }
      - { label: "Spotify URL", name: "spotify", widget: "string", required: false }
      - { label: "Apple Music", name: "apple_music", widget: "string", required: false }
      - { label: "YouTube", name: "youtube", widget: "string", required: false }
      - { label: "Bandcamp", name: "bandcamp", widget: "string", required: false }
      - { label: "Smartlink", name: "smartlink", widget: "string", required: false }
      - { label: "Order", name: "weight", widget: "number", value_type: "int", required: false }
      - { label: "Description", name: "body", widget: "markdown", required: false }

  # ─── Premsa ──────────────────────────────────────
  - name: "press-ca"
    label: "Premsa (CA)"
    files:
      - { name: "premsa-ca", label: "Premsa", file: "content/ca/premsa/_index.md",
          fields: [ { label: "Título", name: "title", widget: "string" },
                    { label: "Fondo", name: "bg", widget: "image", required: false },
                    { label: "Descripción", name: "description", widget: "string", required: false },
                    { label: "Cuerpo", name: "body", widget: "markdown" } ] }

  - name: "press-es"
    label: "Prensa (ES)"
    files:
      - { name: "prensa-es", label: "Prensa", file: "content/es/prensa/_index.md",
          fields: [ { label: "Título", name: "title", widget: "string" },
                    { label: "Fondo", name: "bg", widget: "image", required: false },
                    { label: "Descripción", name: "description", widget: "string", required: false },
                    { label: "Cuerpo", name: "body", widget: "markdown" } ] }

  - name: "press-en"
    label: "Press (EN)"
    files:
      - { name: "press-en", label: "Press", file: "content/en/press/_index.md",
          fields: [ { label: "Title", name: "title", widget: "string" },
                    { label: "Background", name: "bg", widget: "image", required: false },
                    { label: "Description", name: "description", widget: "string", required: false },
                    { label: "Body", name: "body", widget: "markdown" } ] }

  # ─── Galeries fotogràfiques ──────────────────────
  - name: "galleries"
    label: "Fotos — Álbumes"
    file: "data/galleries.yaml"
    fields:
      - label: "Álbumes"
        name: "galleries"
        widget: "list"
        summary: "{{title.ca}}"
        fields:
          - { label: "ID", name: "id", widget: "string" }
          - { label: "Tipo", name: "kind", widget: "select", options: ["chronicle", "photos"] }
          - label: "Título"
            name: "title"
            widget: "object"
            fields:
              - { label: "CA", name: "ca", widget: "string" }
              - { label: "ES", name: "es", widget: "string", required: false }
              - { label: "EN", name: "en", widget: "string", required: false }
          - { label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", required: false }
          - { label: "Autor", name: "author", widget: "string", required: false }
          - { label: "URL autor", name: "author_url", widget: "string", required: false }
          - { label: "URL crónica", name: "url", widget: "string", required: false }
          - { label: "Portada", name: "cover", widget: "image", required: false }
